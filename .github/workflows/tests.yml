name: PowerShell tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    name: Pester (PowerShell 7)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Pester 5
        shell: pwsh
        run: |
          # Trust PSGallery on the disposable GitHub-hosted runner.
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # Install the latest compatible Pester 5 release for this test suite.
          Install-Module -Name Pester `
            -MinimumVersion 5.4.0 `
            -MaximumVersion 5.99.99 `
            -Repository PSGallery `
            -Scope CurrentUser `
            -Force `
            -SkipPublisherCheck
          # Load Pester 5 explicitly before invoking the tests.
          Import-Module Pester -MinimumVersion 5.4.0 -MaximumVersion 5.99.99 -Force

      - name: Run offline tests
        shell: pwsh
        run: |
          # Run the offline suite and capture its summary for a reliable CI exit code.
          $result = Invoke-Pester -Path ./Tests -PassThru
          # Fail the workflow when Pester reports any failed tests.
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed."
          }
